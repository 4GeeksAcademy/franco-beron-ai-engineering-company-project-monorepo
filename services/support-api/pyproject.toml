[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-support-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "langgraph>=1.2.20",
    "libpass[bcrypt]==1.9.3",
    "nexova-rag",
    "psycopg[binary]==3.2.10",
    "python-dotenv==1.2.3",
    "python-jose[cryptography]==3.5.0",
    "resend==2.42.0",
    "sqlmodel==0.0.27",
    "tinydb==4.9.0",
    "uvicorn[standard]==0.52.0",
]

[project.scripts]
seed = "seed:main"

[tool.setuptools]
py-modules = ["seed"]

[tool.uv.sources]
nexova-rag = { path = "../../data/pipelines/nexova_rag", editable = true }

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
